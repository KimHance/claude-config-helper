# cchelp criteria-mapping (binding rules 형식)
# 카테고리 → tab/group 매핑. page list 는 mintlify docsConfig 가 자동 갱신.
# Aggregator 가 record 의 (tab, group, page) 보고 카테고리 binding.

# 베이스라인 룰 파일의 4섹션 헤딩. oracle 워크플로의 도우미 prompt 와 apply
# 스크립트가 같은 목록을 읽도록 단일 출처로 둔다. 이름이 바뀌면 모든 베이스라인
# 파일의 ## 헤딩도 같이 갱신해야 한다.
section_names:
  - Fundamentals
  - Advanced
  - Recommended
  - Anti-patterns

categories:
  - name: skills
    bind:
      - tab: "Build with Claude Code"
        group: "Tools and plugins"
        page_filter: "skills"
    review_file: docs/baseline/skills.md
    template_file: skills/generate/references/skill-template.md
    benchmark: true

  - name: subagents
    bind:
      - tab: "Build with Claude Code"
        group: "Agents"
    review_file: docs/baseline/subagents.md
    template_file: skills/generate/references/agent-template.md
    benchmark: true

  - name: hooks
    bind:
      - tab: "Build with Claude Code"
        group: "Automation"
        page_filter: "hooks*"
      - tab: "Reference"
        group: "Reference"
        page_filter: "hooks*"
    review_file: docs/baseline/hooks.md
    template_file: skills/generate/references/hooks-template.md

  - name: mcp
    bind:
      - tab: "Build with Claude Code"
        group: "Tools and plugins"
        page_filter: "mcp"
    review_file: docs/baseline/mcp.md
    template_file: skills/generate/references/mcp-template.md

  - name: claude-md
    bind:
      - tab: "Getting started"
        group: "Use Claude Code"
        page_filter: "memory"
    review_file: docs/baseline/claude-md.md
    template_file: skills/generate/references/claude-md-template.md

  - name: commands
    bind:
      - tab: "Reference"
        group: "Reference"
        page_filter: "commands"
    review_file: docs/baseline/commands.md
    template_file: skills/generate/references/command-template.md

  - name: settings
    bind:
      - tab: "Configuration"
        group: "Settings and permissions"
        page_filter: "settings"
    review_file: docs/baseline/settings.md
    template_file: skills/generate/references/settings-template.md

  - name: permissions
    bind:
      - tab: "Configuration"
        group: "Settings and permissions"
        page_filter: "permissions"
    review_file: docs/baseline/permissions.md

  - name: plugins
    bind:
      - tab: "Build with Claude Code"
        group: "Tools and plugins"
        page_filter: "plugins"
      - tab: "Build with Claude Code"
        group: "Tools and plugins"
        page_filter: "discover-plugins"
      - tab: "Reference"
        group: "Reference"
        page_filter: "plugins-reference"
      - tab: "Administration"
        group: "Plugin distribution"
        page_filter: "plugin-marketplaces"
    review_file: docs/baseline/plugins.md

excluded_tabs:
  - "Agent SDK"
  - "What's New"
  - "Resources"

priority:
  tabs:
    - "Reference"
    - "Configuration"
    - "Administration"
    - "Build with Claude Code"
    - "Getting started"
