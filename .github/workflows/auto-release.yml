name: Auto Release

on:
  pull_request:
    types: [closed]

jobs:
  release:
    if: |
      github.event.pull_request.merged == true &&
      (contains(github.event.pull_request.labels.*.name, 'criteria-update') ||
       contains(github.event.pull_request.labels.*.name, 'automated'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Tag + release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(grep -o '"version": *"[^"]*"' .claude-plugin/plugin.json | head -1 | grep -o '[0-9]\+\.[0-9]\+\.[0-9]\+')
          TAG="v${VERSION}"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists, skipping"
            exit 0
          fi

          git config user.name "claude[bot]"
          git config user.email "claude[bot]@users.noreply.github.com"
          git tag "$TAG"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin "$TAG"

          BODY="Automated release for PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.title }})."
          PAYLOAD=$(jq -nc --arg tag "$TAG" --arg name "Release $TAG" --arg body "$BODY" \
            '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false, make_latest: "true"}')
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "$PAYLOAD"
