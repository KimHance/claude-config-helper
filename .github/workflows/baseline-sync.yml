name: Baseline Sync

# 베이스라인 룰 파일을 공식 docs 와 비교해 의미가 달라진 섹션만 갱신.
# JOB1: oracle-sync + commit to branch
# JOB2: self-review + version bump (needs JOB1)
# JOB3: PR 생성 + 라벨링 + 리뷰어 지정 (needs JOB1+2)

on:
  workflow_dispatch: {}
  schedule:
    - cron: '0 3 * * 1'  # 매주 월요일 03:00 UTC

permissions:
  contents: write
  id-token: write
  pull-requests: write
  issues: write
  actions: write

env:
  REPORTS_DIR: /tmp/baseline-sync-reports
  BASELINE_DIR: docs/baseline
  MAPPING_FILE: .github/criteria-mapping.yml

jobs:
  sync-and-commit:
    runs-on: ubuntu-latest
    outputs:
      branch: ${{ steps.create-branch.outputs.branch }}
      has_changes: ${{ steps.gate.outputs.has_changes }}
      changed_categories: ${{ steps.gate.outputs.changed_categories }}
      run_id: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }

      - name: Install cron deps
        working-directory: cron
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - name: Snapshot baselines (before)
        run: |
          mkdir -p /tmp/baseline-before
          cp -r ${{ env.BASELINE_DIR }}/*.md /tmp/baseline-before/

      - name: Baseline sync check (claude-code-action spawns claude-code-guide per category)
        id: baseline-sync-check
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --permission-mode bypassPermissions
            --allowed-tools Bash,Read,Write,Task,WebFetch,WebSearch
          prompt: |
            You are the baseline-sync coordinator. Goal: review 9 category rule
            files against the official Claude Code docs, and write one JSON
            report per category. You only orchestrate — the assistants do the
            review.

            Categories and rule file paths:
            - skills        -> docs/baseline/skills.md
            - subagents     -> docs/baseline/subagents.md
            - hooks         -> docs/baseline/hooks.md
            - mcp           -> docs/baseline/mcp.md
            - claude-md     -> docs/baseline/claude-md.md
            - commands      -> docs/baseline/commands.md
            - settings      -> docs/baseline/settings.md
            - permissions   -> docs/baseline/permissions.md
            - plugins       -> docs/baseline/plugins.md

            Steps (in order):
            1) Run `mkdir -p /tmp/baseline-sync-reports` via Bash.
            2) In a SINGLE message, dispatch 9 Task calls in parallel.
               subagent_type = "claude-code-guide" for all 9. Each assistant
               receives the template below with <CATEGORY> and <RULE_FILE>
               substituted:

               ---
               You are reviewing the <CATEGORY> category of the cchelp review
               baseline against the official Claude Code docs. Follow this
               procedure exactly. Do not improvise; do not skip steps.

               STEP 1 — READ the existing baseline.
                 Read <RULE_FILE>. Note every concrete fact present (option
                 names, flag syntax, env vars, behavior rules). Treat the
                 baseline as the SOURCE OF TRUTH for what facts are already
                 covered.

               STEP 2 — FETCH a fixed page set. Do NOT freelance.
                 Fetch EXACTLY these pages, no more, no fewer:
                   (a) The main reference page for <CATEGORY>:
                       https://code.claude.com/docs/en/<CATEGORY>
                       (For mcp: https://code.claude.com/docs/en/mcp
                        For claude-md: https://code.claude.com/docs/en/memory)
                   (b) The Claude Code changelog page:
                       https://code.claude.com/docs/en/changelog
                   (c) ONE adjacent page IF the baseline explicitly references
                       it (e.g., skills baseline references "permissions" =>
                       fetch permissions page). If none referenced, skip.

                 Cap: 2 or 3 pages total. More fetches do NOT improve quality;
                 they introduce noise.

                 NEVER fetch:
                   - Any page under `agent-sdk/`
                   - Pages about SDK / programmatic API only
                 If an adjacent page contains an SDK section, ignore that
                 section. Only extract Claude Code (CLI) facts.

               STEP 2.5 — BASELINE CHECK before claiming "new"
                 Before writing a reason like "vX.Y.Z added FOO" or
                 "doc page: FOO":
                   1. grep the EXISTING baseline section body (from STEP 1)
                      for substring matching FOO (case-insensitive).
                   2. If FOO (or close paraphrase) is already present in
                      the existing baseline -> DO NOT claim as new. Drop
                      FOO from new_body, drop the claim from reason.
                   3. Only a fact that is BOTH in docs AND ABSENT from
                      the existing baseline qualifies as "new".
                   4. When writing new_body, the NEW addition must be
                      visually identifiable: a line/bullet/phrase that
                      did NOT exist in BEFORE.

               STEP 2.6 — DELETION REQUIRES TRIPLE CHECK
                 Before proposing to REMOVE any existing baseline fact:
                   1. The category's main page was already fetched in
                      STEP 2(a).
                   2. ADDITIONALLY fetch:
                      - https://code.claude.com/docs/en/settings
                        (settings-related anti-patterns often live here,
                        e.g., skipDangerousModePermissionPrompt is a
                        settings key, not a permissions key)
                      - changelog (already fetched in STEP 2(b)) — check
                        for deprecation notice.
                   3. Only if absent from ALL THREE pages AND no
                      deprecation notice exists -> propose deletion.
                      Single-page absence is INSUFFICIENT.
                   4. If proposing deletion, the reason MUST cite all 3
                      sources checked and the substring searched.

               STEP 3 — DECISION TREE per section.
                 For each of the 4 sections (Fundamentals, Advanced,
                 Recommended, Anti-patterns), apply this tree IN ORDER and
                 stop at the first matching branch:

                 Q1: Is every fact in the baseline section still confirmed by
                     the docs?
                     YES + no NEW facts in changelog for this section
                          -> changed: false. STOP.
                     YES + changelog adds a NEW stable fact directly relevant
                          to this section
                          -> changed: true. Write new_body that keeps all
                             existing facts unchanged AND appends the new
                             fact only.
                     NO  -> A baseline fact is missing/contradicted in docs.
                            -> changed: true. Write new_body with the
                               outdated fact removed/corrected. Do NOT add
                               unrelated new facts in the same change.

                 Hard rules:
                   - Synonym swap, sentence-restructure, bullet->prose
                     reformat are FORBIDDEN. They count as changed: false.
                   - "Beta", "experimental", "preview" features in docs that
                     are NOT in the changelog as stable -> do NOT add. Treat
                     as changed: false.
                   - When uncertain, choose changed: false. Speculation is
                     forbidden.

                 DEFAULT ACTION IS ALWAYS `changed: false`.

                 `changed: true` requires ALL of:
                   (a) reason cites at least one specific new noun/symbol/
                       CLI flag/env var not in BEFORE baseline
                       (verified by STEP 2.5).
                   (b) source URL points to a page where that noun is
                       documented.
                   (c) self-check (STEP 3.5 below) confirms the noun
                       appears in diff(new_body, BEFORE).

                 If ANY of (a)(b)(c) fails -> set `changed: false`.
                 No exceptions.

               STEP 3.5 — DIFF-REASON SELF-CHECK (before WRITE)
                 After drafting new_body and reason:
                   1. Compute byte-level diff: BEFORE section body vs
                      new_body.
                   2. For each fact mentioned in reason, verify it appears
                      in the diff (the NEW content added by this change).
                      Case-insensitive substring match is OK.
                   3. If reason claims "X added" but diff does NOT contain
                      X -> reason is hallucinated. Either remove that claim
                      from reason OR set `changed: false` for this section.
                   4. If diff contains a substantial change (new line,
                      removed line, new identifier) NOT mentioned in
                      reason -> reason is incomplete. Add an entry to
                      reason OR revert that change from new_body.
                   5. This step is MANDATORY. Do not skip.

               STEP 4 — REASON FORMAT (when changed: true only).
                 reason MUST follow this shape:
                   "<changelog version or 'doc page'>: <one-line concrete
                    fact>. Source: <single URL>"
                 Examples:
                   "v2.1.136: settings.autoMode.hard_deny added for
                    unconditional deny rules. Source:
                    https://code.claude.com/docs/en/settings"
                   "doc page: claude mcp reset-project-choices CLI added.
                    Source: https://code.claude.com/docs/en/mcp"
                 If you must report multiple facts in one section, use one
                 bullet per fact, each with its own URL. Do not write
                 paragraphs.

               STEP 5 — WRITE the report to
                       /tmp/baseline-sync-reports/<CATEGORY>.json
                 Schema:
                   {
                     "category": "<CATEGORY>",
                     "rule_file": "<RULE_FILE>",
                     "sections": {
                       "Fundamentals": { "changed": true|false,
                                         "new_body": "...section body...",
                                         "reason": "...",
                                         "sources": ["url1", ...] },
                       "Advanced":     { ... },
                       "Recommended":  { ... },
                       "Anti-patterns":{ ... }
                     }
                   }
                 - Sections with changed: false MAY omit new_body / reason /
                   sources entirely.
                 - new_body MUST NOT include the heading ("## ..."). Body
                   only. Preserve original formatting style (if baseline used
                   bullets, keep bullets; if prose, keep prose).
                 - Last message must be exactly:
                       DONE: /tmp/baseline-sync-reports/<CATEGORY>.json
               ---

            3) After all 9 assistants reply, run
               `ls /tmp/baseline-sync-reports/` to confirm 9 files exist.
               If any missing, re-spawn ONLY that category.
            4) When all 9 confirmed, output exactly: `done: 9 reports`

      - name: Show report summaries (debug)
        if: always()
        run: |
          ls -la ${{ env.REPORTS_DIR }} || echo "no reports dir"
          for f in ${{ env.REPORTS_DIR }}/*.json; do
            echo "=== $f ==="
            jq '{category, sections: (.sections | map_values({changed}))}' "$f" 2>/dev/null || cat "$f"
          done

      - name: Apply baseline-sync reports to baselines
        id: apply
        # 워크스페이스 루트에서 실행해야 도우미가 적은 상대경로
        # (예: docs/baseline/skills.md) 가 정확히 풀림.
        # PYTHONPATH=cron 으로 모듈 검색 경로만 추가.
        run: |
          PYTHONPATH=cron cron/.venv/bin/python -m scripts.apply_baseline_sync_reports \
            ${{ env.REPORTS_DIR }} \
            ${{ env.MAPPING_FILE }} \
          | tee /tmp/apply-summary.json

      - name: Compute baseline diff
        if: always()
        run: |
          mkdir -p /tmp/baseline-diff
          for f in ${{ env.BASELINE_DIR }}/*.md; do
            base=$(basename "$f")
            if [ -f "/tmp/baseline-before/$base" ]; then
              diff -u "/tmp/baseline-before/$base" "$f" > "/tmp/baseline-diff/$base.diff" || true
            fi
          done
          ls -la /tmp/baseline-diff

      - name: gate (no change?)
        id: gate
        run: |
          # Count categories with at least one non-empty diff
          CHANGED=0
          for d in /tmp/baseline-diff/*.diff; do
            [ -s "$d" ] && CHANGED=$((CHANGED + 1))
          done
          echo "changed_categories=$CHANGED" >> $GITHUB_OUTPUT
          if [ "$CHANGED" -eq 0 ]; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "::notice ::no baseline drift — JOB2/3 will skip"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

      - name: create branch + commit baseline
        id: create-branch
        if: steps.gate.outputs.has_changes == 'true'
        run: |
          BRANCH="chore/baseline-sync-$(date -u +%Y-%m-%d)-${{ github.run_id }}"
          git config user.name "claude[bot]"
          git config user.email "claude[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add docs/baseline/
          git commit -m "chore(baseline): sync from docs (run ${{ github.run_id }})"
          echo "branch=$BRANCH" >> $GITHUB_OUTPUT

      - name: push branch
        if: steps.gate.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin "${{ steps.create-branch.outputs.branch }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: baseline-sync-results-${{ github.run_id }}
          path: |
            /tmp/baseline-sync-reports/*.json
            /tmp/apply-summary.json
            /tmp/baseline-diff/*.diff
            ${{ env.BASELINE_DIR }}/*.md
          retention-days: 30
          if-no-files-found: warn

  project-review:
    runs-on: ubuntu-latest
    needs: sync-and-commit
    if: needs.sync-and-commit.outputs.has_changes == 'true'
    outputs:
      verdict: ${{ steps.meta.outputs.verdict }}
      bump_level: ${{ steps.validate.outputs.level }}
      bump_warning: ${{ steps.validate.outputs.warning }}
      new_version: ${{ steps.read_version.outputs.new_version }}
      bench_present: ${{ steps.bench_meta.outputs.present }}
      bench_q_susp: ${{ steps.bench_meta.outputs.q_susp }}
      bench_e_susp: ${{ steps.bench_meta.outputs.e_susp }}
      suspicion_count: ${{ steps.meta.outputs.suspicion_count }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync-and-commit.outputs.branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install cron deps
        working-directory: cron
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - uses: actions/download-artifact@v4
        with:
          name: baseline-sync-results-${{ needs.sync-and-commit.outputs.run_id }}
          path: /tmp/job1-art

      - name: locate fixture paths
        id: paths
        run: |
          # actions/download-artifact@v4 extracts flat into the path directory.
          # Files from artifact are stored under /tmp/job1-art preserving their
          # internal directory structure (tmp/... or direct).
          if [ -f /tmp/job1-art/tmp/apply-summary.json ]; then
            echo "summary=/tmp/job1-art/tmp/apply-summary.json" >> $GITHUB_OUTPUT
            echo "reports=/tmp/job1-art/tmp/baseline-sync-reports" >> $GITHUB_OUTPUT
            echo "diff=/tmp/job1-art/tmp/baseline-diff" >> $GITHUB_OUTPUT
          elif [ -f /tmp/job1-art/apply-summary.json ]; then
            echo "summary=/tmp/job1-art/apply-summary.json" >> $GITHUB_OUTPUT
            echo "reports=/tmp/job1-art/baseline-sync-reports" >> $GITHUB_OUTPUT
            echo "diff=/tmp/job1-art/baseline-diff" >> $GITHUB_OUTPUT
          else
            echo "ERROR: apply-summary.json not found under /tmp/job1-art" >&2
            find /tmp/job1-art -type f | head -30 >&2
            exit 1
          fi

      - name: prepare-review-input
        run: |
          PYTHONPATH=cron cron/.venv/bin/python -m scripts.prepare_review_input \
            ${{ steps.paths.outputs.summary }} \
            ${{ steps.paths.outputs.reports }} \
            ${{ steps.paths.outputs.diff }} \
            /tmp/review-input.md
          wc -l /tmp/review-input.md

      - name: self-review + bump (claude)
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --permission-mode bypassPermissions
            --allowed-tools Bash,Read,Write
          prompt: |
            You are the baseline-sync JOB 2 self-review assistant.

            Input: /tmp/review-input.md (only categories that JOB 1 actually
            changed are bundled there).

            Procedure:

            STEP 1 — Read /tmp/review-input.md.

            STEP 2 — Sanity audit per changed category. Apply these 8 checks
            (C8 is run separately as cross-check-deletions; not here):

              C1 Synonym/format swap only? — diff replaces words with synonyms,
                 reorders sentences, or converts bullets <-> prose without
                 adding/removing facts. SUSPICIOUS if yes.
              C2 SDK fact intrusion? — added text mentions SDK options
                 (e.g., `tools: ["Skill"]`, `--system-prompt`, programmatic
                 API), or facts that only apply to the Agent SDK rather than
                 Claude Code CLI. SUSPICIOUS if yes.
              C3 Section deletion >50%? — a single section's body shrinks by
                 more than half by line count, AND the removed lines were
                 substantive (not just a single bullet trim). SUSPICIOUS if
                 yes.
              C4 reason → diff (forward): each fact mentioned in reason
                 actually appears in the diff (e.g., reason says "added X"
                 and X is present in diff). SUSPICIOUS if a reason claim is
                 absent from diff.
              C5 Source URL present? — every changed section has at least one
                 entry in `sources`. MISSING URL is SUSPICIOUS.

              C6 diff → reason (REVERSE): for each substantive change in the
                 diff (new line, removed line, new identifier), is it
                 mentioned in reason? SUSPICIOUS if a diff change is
                 UNCOVERED by reason.
              C7 fake-new check: for each "vN.M.Z: X added" or
                 "doc page: X added" claim in reason, grep the BEFORE
                 section content (visible in review-input.md diff context)
                 for X. If X already present in BEFORE → SUSPICIOUS: claim
                 is fake new (the fact already existed in baseline).
              C9 wording-only detector: check the diff for new tokens NOT
                 in BEFORE — identifiers (snake_case, camelCase, kebab-case),
                 CLI flags (--foo), env vars (UPPER_SNAKE), version numbers
                 (vN.M.Z), numeric quantities. If diff has NONE of these
                 AND only word-level rewording / reordering / prose↔bullet
                 conversion → SUSPICIOUS: wording-only change, should be
                 changed:false.

            STEP 3 — Decide verdict (exactly one):
              - pass  : zero suspicious checks across all categories.
              - warn  : 1+ suspicious checks but baseline is structurally OK.
              - block : a baseline section body is empty / corrupted /
                        replaced with garbage. (rare)

            STEP 4 — Decide bump level (exactly one):
              - patch : only formatting / typo / example tweaks. No new facts.
              - minor : at least one new fact added; no existing fact removed
                        or contradicted.
              - major : at least one existing fact removed/contradicted, or
                        a deprecation/behavior change.

            STEP 5 — Write two files:

              (a) /tmp/review-summary.md — markdown report. Required structure:

                  ## Checks Matrix
                  | Check | <cat1> | <cat2> | ... |
                  |---|---|---|---|
                  | C1 Synonym/format swap | OK / SUSPICIOUS: <why> | ... |
                  | C2 SDK intrusion | OK / SUSPICIOUS: <why> | ... |
                  | C3 Section deletion >50% | OK / SUSPICIOUS: <why> | ... |
                  | C4 reason→diff (forward) | OK / SUSPICIOUS: <why> | ... |
                  | C5 source URL present | OK / SUSPICIOUS: <why> | ... |
                  | C6 diff→reason (reverse) | OK / SUSPICIOUS: <why> | ... |
                  | C7 fake-new check | OK / SUSPICIOUS: <why> | ... |
                  | C9 wording-only | OK / SUSPICIOUS: <why> | ... |

                  ## Per-category notes
                  - **<cat>**: one sentence summary of what the diff actually
                    changes (factual, no value judgment).

                  ## Suspicion Summary
                  Numbered list of every SUSPICIOUS finding. If none, write
                  "No suspicions." instead of the list.

                  Last two lines (machine-parsed; format exactly):
                  verdict: <pass|warn|block>
                  bump_level_hint: <patch|minor|major>

              (b) /tmp/bump.json — schema exactly:
                  {
                    "level": "patch|minor|major",
                    "reason": "<one short sentence summarizing what new
                               facts/changes drove this level>",
                    "evidence_files": ["docs/baseline/<cat>.md", ...]
                  }
                  Only list baseline files that actually appear changed in the
                  diff.

            STEP 6 — Output exactly: DONE

      - name: validate-bump
        id: validate
        run: |
          TOTAL=$(wc -l ${{ steps.paths.outputs.diff }}/*.diff 2>/dev/null | tail -1 | awk '{print $1}' || echo 0)
          PYTHONPATH=cron cron/.venv/bin/python -m scripts.validate_bump \
            /tmp/bump.json ${{ steps.paths.outputs.diff }} $TOTAL > /tmp/bump.validated.json
          mv /tmp/bump.validated.json /tmp/bump.json
          cat /tmp/bump.json
          echo "level=$(jq -r .level /tmp/bump.json)" >> $GITHUB_OUTPUT
          echo "warning=$(jq -r .bump_warning /tmp/bump.json)" >> $GITHUB_OUTPUT

      - name: apply-bump
        run: |
          NEW=$(PYTHONPATH=cron cron/.venv/bin/python -m scripts.apply_bump \
            .claude-plugin/plugin.json ${{ steps.validate.outputs.level }})
          echo "new version: $NEW"
          echo "$NEW" > /tmp/new_version
          # Sync marketplace.json plugin entry to the same version
          tmp=$(mktemp)
          jq --arg v "$NEW" '.plugins[0].version = $v' .claude-plugin/marketplace.json > "$tmp" \
            && mv "$tmp" .claude-plugin/marketplace.json
          echo "marketplace.json synced to $NEW"

      - name: read new version
        id: read_version
        run: |
          echo "new_version=$(cat /tmp/new_version)" >> $GITHUB_OUTPUT

      - name: meta (parse verdict + suspicion count from review-summary.md)
        id: meta
        run: |
          VERDICT=$(grep -E '^verdict: ' /tmp/review-summary.md | head -1 | awk '{print $2}' || echo "pass")
          # Count SUSPICIOUS occurrences in the review summary — covers C1-C9
          # findings. Used to escalate to low-confidence label when > 0.
          SUSPICION_COUNT=$(grep -c "SUSPICIOUS" /tmp/review-summary.md || true)
          echo "verdict=$VERDICT" >> $GITHUB_OUTPUT
          echo "suspicion_count=$SUSPICION_COUNT" >> $GITHUB_OUTPUT

      - name: select-bench-targets
        id: bench-pick
        run: |
          # Read changed categories from apply-summary; if "skills" or "subagents"
          # was changed, that triggers benchmarking ALL files in the corresponding
          # cchelp directory.
          CHANGED=$(jq -r '.details[] | select(.changed_sections>0) | .file' \
            "${{ steps.paths.outputs.summary }}" \
            | xargs -n1 basename | sed 's/\.md$//' | tr '\n' ' ')
          TARGETS='[]'
          if [[ " $CHANGED " == *" skills "* ]]; then
            for f in skills/*/SKILL.md; do
              [ -f "$f" ] || continue
              name=$(basename "$(dirname "$f")")
              TARGETS=$(jq -c --arg path "$f" --arg name "$name" \
                '. + [{path: $path, name: $name}]' <<< "$TARGETS")
            done
          fi
          if [[ " $CHANGED " == *" subagents "* ]]; then
            for f in agents/*.md; do
              [ -f "$f" ] || continue
              name=$(basename "$f" .md)
              TARGETS=$(jq -c --arg path "$f" --arg name "$name" \
                '. + [{path: $path, name: $name}]' <<< "$TARGETS")
            done
          fi
          COUNT=$(jq length <<< "$TARGETS")
          echo "targets=$TARGETS" >> $GITHUB_OUTPUT
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Bench targets: $COUNT"
          echo "$TARGETS" | jq

      - name: run-benchmarks
        if: steps.bench-pick.outputs.count != '0'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --permission-mode bypassPermissions
            --allowed-tools Bash,Read,Write,Task
          prompt: |
            You are the benchmark dispatcher for cchelp baseline-sync JOB 2. The pipeline is now in-memory only — agents pass JSON via response messages, no filesystem.

            Targets to benchmark (JSON list of {path, name} objects):
            ${{ steps.bench-pick.outputs.targets }}

            Process for EACH target {path, name}:

            1) In a SINGLE message, dispatch TWO Task calls in PARALLEL:
               - Task: subagent_type="cchelp:eval-runner", description="bench <name> with_skill",
                 prompt:
                   "target_path: <path>\nmode: with_skill\n\nFollow your in-memory protocol: read target, generate 2-3 prompts, execute under with_skill, return final JSON inline as fenced code block per agent spec. NO file writes."
               - Task: subagent_type="cchelp:eval-runner", description="bench <name> baseline",
                 prompt:
                   "target_path: <path>\nmode: baseline\n\nFollow your in-memory protocol: read target (only to derive prompts), generate 2-3 prompts, execute under baseline (no skill loaded), return final JSON inline as fenced code block. NO file writes."

            2) From each eval-runner's response, parse:
               (a) the fenced JSON block with `samples`
               (b) the `<usage>` block at the end (`total_tokens`, `duration_ms`)

            3) Dispatch grader once per target:
               - Task: subagent_type="cchelp:grader", description="grade <name>",
                 prompt: a fenced JSON block with the EXACT shape from grader's spec, populated with the two samples sets and the captured usage. Pass it inline. The grader returns `{category, aggregate}` JSON inline.

            4) Collect each grader's returned `{category, aggregate}` JSON object into a list.

            5) After ALL targets are processed, write the collected list to `/tmp/bench/_gradings.json` so the next step can pick it up. (This single file write is performed by the orchestrating session, not by subagents.)

               Format the file as a JSON array, e.g.:
               ```
               [
                 {"category": "review", "aggregate": {...}},
                 {"category": "reviewer", "aggregate": {...}}
               ]
               ```

            6) Output exactly: `BENCH DONE: <N> targets`

      - name: extract-deletions
        id: deletions
        run: |
          PYTHONPATH=cron cron/.venv/bin/python -m scripts.parse_deletion_facts \
            ${{ steps.paths.outputs.summary }} \
            ${{ steps.paths.outputs.reports }} \
            ${{ steps.paths.outputs.diff }} > /tmp/deletions.json
          COUNT=$(jq length /tmp/deletions.json)
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "Found $COUNT deletion candidates"
          cat /tmp/deletions.json

      - name: cross-check-deletions (C8)
        if: steps.deletions.outputs.count != '0'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --permission-mode bypassPermissions
            --allowed-tools Bash,Read,Write,Task,WebFetch
          prompt: |
            You are the deletion cross-check coordinator for baseline-sync.

            Input: /tmp/deletions.json — array of {category, deleted_line} entries.

            For EACH deletion entry, spawn THREE Task subagents in PARALLEL
            (subagent_type=`claude-code-guide`), one per docs page:

              Subagent A: WebFetch https://code.claude.com/docs/en/permissions
                Search the page body (case-insensitive substring) for the key
                noun or identifier mentioned in `deleted_line`. Return JSON:
                `{found: bool, evidence: "<verbatim quote or null>"}`.

              Subagent B: WebFetch https://code.claude.com/docs/en/settings
                Same — search for the key noun. (Many settings-related facts
                that are absent from /permissions actually live here.)

              Subagent C: WebFetch https://code.claude.com/docs/en/changelog
                Search for a deprecation/removal notice for the deleted noun.
                Return `{found_deprecation: bool, evidence: "..."}`.

            Aggregate: a deletion is VALID only if:
              - Subagent A found:false AND
              - Subagent B found:false AND
              - Subagent C found_deprecation:true OR found_deprecation:false
                with no contradicting info.

            If ANY of A/B return found:true → the deletion is INVALID
            (the fact exists in docs; deletion is hallucination).

            Write `/tmp/cross-check.json` as a JSON array:
            [
              {
                "category": "<cat>",
                "deleted_line": "<line>",
                "valid": <bool>,
                "evidence": {
                  "permissions_page": "...",
                  "settings_page": "...",
                  "changelog": "..."
                }
              }
            ]

            Output exactly one final line: `CROSS-CHECK DONE: <invalid>/<total> invalid deletions`

      - name: integrate-cross-check
        if: steps.deletions.outputs.count != '0'
        run: |
          if [ -f /tmp/cross-check.json ]; then
            INVALID=$(jq '[.[] | select(.valid == false)] | length' /tmp/cross-check.json)
            TOTAL=$(jq length /tmp/cross-check.json)
            echo "C8 result: $INVALID of $TOTAL deletions INVALID"
            if [ "$INVALID" -gt 0 ]; then
              tmp=$(mktemp)
              jq --arg note "C8 detected $INVALID invalid deletion(s) — cross-check trio found the fact in docs" \
                '.bump_warning = true | .validation_notes = ((.validation_notes // "") + " | " + $note)' \
                /tmp/bump.json > "$tmp" && mv "$tmp" /tmp/bump.json
              echo "::warning ::$INVALID invalid deletion(s) detected by C8 cross-check trio"
            fi
          else
            echo "::warning ::cross-check.json missing — C8 did not write output"
          fi

      - name: format-bench-results
        run: |
          if [ -f /tmp/bench/_gradings.json ]; then
            cat /tmp/bench/_gradings.json | \
              PYTHONPATH=cron cron/.venv/bin/python -m scripts.format_bench_results \
                --inline /tmp/bench-summary.json
          else
            mkdir -p /tmp/bench-empty
            PYTHONPATH=cron cron/.venv/bin/python -m scripts.format_bench_results \
              /tmp/bench-empty /tmp/bench-summary.json
          fi
          cat /tmp/bench-summary.json

      - name: bench meta (parse bench-summary.json)
        id: bench_meta
        run: |
          echo "present=$(jq -r .bench_present /tmp/bench-summary.json)" >> $GITHUB_OUTPUT
          echo "q_susp=$(jq -r .bench_quality_suspicious /tmp/bench-summary.json)" >> $GITHUB_OUTPUT
          echo "e_susp=$(jq -r .bench_efficiency_suspicious /tmp/bench-summary.json)" >> $GITHUB_OUTPUT

      - name: commit + push version bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "claude[bot]"
          git config user.email "claude[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json .claude-plugin/marketplace.json
          git commit -m "chore(version): bump to $(cat /tmp/new_version)"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          git push origin "${{ needs.sync-and-commit.outputs.branch }}"

      - name: upload review artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-results-${{ github.run_id }}
          path: |
            /tmp/review-input.md
            /tmp/review-summary.md
            /tmp/bump.json
            /tmp/bench-summary.json
            /tmp/new_version
          if-no-files-found: warn
          retention-days: 30

  create-pr:
    runs-on: ubuntu-latest
    needs: [sync-and-commit, project-review]
    if: needs.sync-and-commit.outputs.has_changes == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.sync-and-commit.outputs.branch }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: install cron deps
        working-directory: cron
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ".[dev]"

      - uses: actions/download-artifact@v4
        with:
          name: baseline-sync-results-${{ needs.sync-and-commit.outputs.run_id }}
          path: /tmp/job1-art

      - uses: actions/download-artifact@v4
        with:
          name: review-results-${{ needs.sync-and-commit.outputs.run_id }}
          path: /tmp/job2-art

      - name: locate paths + extract metadata
        id: meta
        run: |
          # JOB1 artifact layout
          if [ -f /tmp/job1-art/tmp/apply-summary.json ]; then
            J1=/tmp/job1-art/tmp
          elif [ -f /tmp/job1-art/apply-summary.json ]; then
            J1=/tmp/job1-art
          else
            echo "ERROR: apply-summary.json not found under /tmp/job1-art" >&2
            find /tmp/job1-art -type f | head -30 >&2
            exit 1
          fi

          # JOB2 artifact layout (flat extraction by actions/download-artifact@v4)
          if [ -f /tmp/job2-art/review-summary.md ]; then
            J2=/tmp/job2-art
          else
            echo "ERROR: review-summary.md not found under /tmp/job2-art" >&2
            find /tmp/job2-art -type f | head -30 >&2
            exit 1
          fi

          echo "summary=$J1/apply-summary.json" >> $GITHUB_OUTPUT
          echo "reports=$J1/baseline-sync-reports" >> $GITHUB_OUTPUT
          echo "diff=$J1/baseline-diff" >> $GITHUB_OUTPUT
          echo "review=$J2" >> $GITHUB_OUTPUT
          echo "new_version=$(cat $J2/new_version)" >> $GITHUB_OUTPUT
          echo "bump_level=$(jq -r .level $J2/bump.json)" >> $GITHUB_OUTPUT
          echo "bump_warning=$(jq -r .bump_warning $J2/bump.json)" >> $GITHUB_OUTPUT
          echo "verdict=$(grep -E '^verdict: ' $J2/review-summary.md | head -1 | awk '{print $2}')" >> $GITHUB_OUTPUT
          echo "bench_present=$(jq -r .bench_present $J2/bench-summary.json)" >> $GITHUB_OUTPUT
          echo "bench_q_susp=$(jq -r .bench_quality_suspicious $J2/bench-summary.json)" >> $GITHUB_OUTPUT
          echo "bench_e_susp=$(jq -r .bench_efficiency_suspicious $J2/bench-summary.json)" >> $GITHUB_OUTPUT
          echo "suspicion_count=$(grep -c 'SUSPICIOUS' $J2/review-summary.md || true)" >> $GITHUB_OUTPUT

      - name: assemble values.json
        env:
          SUMMARY: ${{ steps.meta.outputs.summary }}
          REPORTS: ${{ steps.meta.outputs.reports }}
          NEW_V: ${{ steps.meta.outputs.new_version }}
          BUMP_LEVEL: ${{ steps.meta.outputs.bump_level }}
          BUMP_WARNING: ${{ steps.meta.outputs.bump_warning }}
          VERDICT: ${{ steps.meta.outputs.verdict }}
          BENCH_PRESENT: ${{ steps.meta.outputs.bench_present }}
          BENCH_Q: ${{ steps.meta.outputs.bench_q_susp }}
          BENCH_E: ${{ steps.meta.outputs.bench_e_susp }}
          REVIEW: ${{ steps.meta.outputs.review }}
          RUN_ID: ${{ needs.sync-and-commit.outputs.run_id }}
        run: |
          PYTHONPATH=cron cron/.venv/bin/python <<'PY'
          import json, os, sys
          from pathlib import Path

          summary = json.loads(Path(os.environ["SUMMARY"]).read_text())
          reports_dir = Path(os.environ["REPORTS"])
          new_v = os.environ["NEW_V"]
          bump_level = os.environ["BUMP_LEVEL"]
          bump_warning = os.environ["BUMP_WARNING"] == "true"
          verdict = os.environ["VERDICT"] or "pass"
          bench_present = os.environ["BENCH_PRESENT"] == "true"
          bench_q = os.environ["BENCH_Q"] == "true"
          bench_e = os.environ["BENCH_E"] == "true"
          run_id = os.environ["RUN_ID"]
          repo = os.environ["GITHUB_REPOSITORY"]
          review_dir = Path(os.environ["REVIEW"])

          # JOB3 가 sync 브랜치를 checkout 하므로 plugin.json 은 이미 bump 됨.
          # 진짜 OLD_VERSION 은 main 의 plugin.json (= 이 PR 머지 전 상태) 에서 읽는다.
          import subprocess
          try:
              old_v = subprocess.check_output(
                  ["git", "show", "origin/main:.claude-plugin/plugin.json"],
                  text=True,
              )
              old_v = json.loads(old_v).get("version", "0.0.0")
          except Exception:
              old_v = "0.0.0"

          def fmt_reason(r):
              # reason can be string OR list of strings (new prompt allows list)
              if isinstance(r, list):
                  if not r:
                      return ""
                  if len(r) == 1:
                      return str(r[0]).strip("- ").strip()
                  return "<br>".join("• " + str(x).strip("- ").strip() for x in r)
              return str(r or "")

          def fmt_reason_bullets(r):
              # for the bullet section: each fact on its own line
              if isinstance(r, list):
                  return [str(x).strip("- ").strip() for x in r if str(x).strip()]
              s = str(r or "").strip()
              return [s] if s else []

          rows = []
          per_file = []
          for entry in summary.get("details", []):
              cat = Path(entry["file"]).stem
              ns = entry.get("changed_sections", 0)
              if ns <= 0:
                  continue
              rep_path = reports_dir / f"{cat}.json"
              first_reason_cell = ""
              section_bullets = []
              if rep_path.exists():
                  rep = json.loads(rep_path.read_text())
                  for sec, info in (rep.get("sections") or {}).items():
                      if info.get("changed"):
                          raw = info.get("reason", "")
                          if not first_reason_cell:
                              first_reason_cell = fmt_reason(raw)
                          for fact in fmt_reason_bullets(raw):
                              section_bullets.append(f"- **{cat}/{sec}**: {fact}")
              rows.append(f"| {cat} | `{entry['file']}` | {first_reason_cell} |")
              per_file.extend(section_bullets)

          # review_detail: review-summary.md 본문 그대로 임베드. self-review 가
          # 이미 카테고리별 의심 항목을 markdown 으로 작성해놨으므로 가공 없이
          # 보여주는 게 가장 친절. 끝의 verdict / bump_level_hint 두 줄은 PR
          # body 의 다른 섹션과 중복이라 제거.
          review_detail = ""
          rs = review_dir / "review-summary.md"
          if rs.exists():
              text = rs.read_text().strip()
              lines = text.splitlines()
              filtered = [l for l in lines if not l.startswith("verdict:") and not l.startswith("bump_level_hint:")]
              # 첫 H1 제목 (# Sanity Review Summary 같은 것) 도 PR 본문에선 중복이라 제거
              if filtered and filtered[0].startswith("# "):
                  filtered = filtered[1:]
              review_detail = "\n".join(filtered).strip()

          # benchmark 표 (있으면 그대로 박음. 없으면 섹션 자체 안 그림)
          bench_table = ""
          if bench_present:
              try:
                  bs = json.loads((review_dir / "bench-summary.json").read_text())
                  bench_table = bs.get("markdown", "")
              except Exception:
                  bench_table = ""

          try:
              bump_reason = json.loads((review_dir / "bump.json").read_text()).get("reason", "")
          except Exception:
              bump_reason = ""

          values = {
              "CHANGED_TABLE_ROWS": "\n".join(rows) if rows else "| — | — | — |",
              "PER_FILE_CHANGE_BULLETS": "\n".join(per_file) if per_file else "변경 없음",
              "REVIEW_DETAIL": review_detail,
              "GATE_LABEL": {"pass": "통과", "warn": "경고", "block": "차단"}.get(verdict, verdict),
              "VERDICT": verdict,
              "BENCH_TABLE": bench_table,
              "BUMP_LEVEL": bump_level,
              "OLD_VERSION": old_v,
              "NEW_VERSION": new_v,
              "BUMP_REASON": bump_reason,
              "RUN_ID": run_id,
              "ORACLE_URL": f"https://github.com/{repo}/actions/runs/{run_id}",
              "REVIEW_URL": f"https://github.com/{repo}/actions/runs/{run_id}",
              "RUN_URL": f"https://github.com/{repo}/actions/runs/{run_id}",
          }
          Path("/tmp/values.json").write_text(json.dumps(values, indent=2, ensure_ascii=False))
          print("values.json written")
          PY

      - name: render PR body
        run: |
          PYTHONPATH=cron cron/.venv/bin/python -m scripts.assemble_pr_body \
            .github/templates/pr-body.md.tmpl /tmp/values.json /tmp/pr-body.md
          echo "--- PR body preview ---"
          head -80 /tmp/pr-body.md

      - name: pick labels
        id: labels
        env:
          VERDICT: ${{ steps.meta.outputs.verdict }}
          BUMP_LEVEL: ${{ steps.meta.outputs.bump_level }}
          BUMP_WARNING: ${{ steps.meta.outputs.bump_warning }}
          BENCH_Q: ${{ steps.meta.outputs.bench_q_susp }}
          BENCH_E: ${{ steps.meta.outputs.bench_e_susp }}
          SUSPICION_COUNT: ${{ steps.meta.outputs.suspicion_count }}
          CHANGED_CATS: ${{ needs.sync-and-commit.outputs.changed_categories }}
        run: |
          # 의미 기반 라벨만 사용. 기존 repo 라벨 (automated, criteria-update,
          # routine-update, mass-update, high-impact, low-confidence) 만 부착.
          # criteria-update 는 auto-release.yml 의 원래 트리거와 호환을 위함.
          LABELS='["automated", "criteria-update"]'
          # 의심 신호 우선 — low-confidence. C6/C7/C9 SUSPICIOUS 카운트도 포함
          # (suspicion_count > 0 이면 self-review 가 의심 잡았다는 뜻).
          if [ "$VERDICT" != "pass" ] || [ "$BUMP_WARNING" = "true" ] || \
             [ "$BENCH_Q" = "true" ] || [ "$BENCH_E" = "true" ] || \
             [ "${SUSPICION_COUNT:-0}" -gt 0 ]; then
            LABELS=$(jq -c '. + ["low-confidence"]' <<< "$LABELS")
          fi
          # 영향도
          if [ "$BUMP_LEVEL" = "major" ]; then
            LABELS=$(jq -c '. + ["high-impact"]' <<< "$LABELS")
          fi
          # 변경 규모
          if [ "${CHANGED_CATS:-0}" -ge 5 ]; then
            LABELS=$(jq -c '. + ["mass-update"]' <<< "$LABELS")
          fi
          # 안전한 일상 업데이트
          if [ "$VERDICT" = "pass" ] && [ "$BUMP_LEVEL" = "patch" ] && \
             [ "$BUMP_WARNING" != "true" ] && \
             [ "$BENCH_Q" != "true" ] && [ "$BENCH_E" != "true" ]; then
            LABELS=$(jq -c '. + ["routine-update"]' <<< "$LABELS")
          fi
          echo "labels=$LABELS" >> $GITHUB_OUTPUT
          echo "labels: $LABELS"

      - name: pick reviewers
        id: reviewers
        run: |
          REVIEWERS='[]'
          if [ "${{ steps.meta.outputs.verdict }}" != "pass" ] || \
             [ "${{ steps.meta.outputs.bump_warning }}" = "true" ] || \
             [ "${{ steps.meta.outputs.bench_q_susp }}" = "true" ] || \
             [ "${{ steps.meta.outputs.bench_e_susp }}" = "true" ]; then
            REVIEWERS='["KimHance"]'
          fi
          echo "reviewers=$REVIEWERS" >> $GITHUB_OUTPUT
          echo "reviewers: $REVIEWERS"

      - name: create PR
        id: create_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BODY=$(jq -Rs . < /tmp/pr-body.md)
          RESP=$(curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pulls \
            -d "{
              \"title\": \"chore: baseline 동기화 v${{ steps.meta.outputs.new_version }} ($(date -u +%Y-%m-%d))\",
              \"head\": \"${{ needs.sync-and-commit.outputs.branch }}\",
              \"base\": \"main\",
              \"body\": $BODY
            }")
          PR_NUMBER=$(echo "$RESP" | jq -r '.number')
          if [ "$PR_NUMBER" = "null" ]; then
            echo "PR creation failed:"; echo "$RESP" | jq .; exit 1
          fi
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
          echo "::notice ::PR #$PR_NUMBER created"

      - name: apply labels
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABELS_JSON: ${{ steps.labels.outputs.labels }}
        run: |
          PAYLOAD=$(jq -nc --argjson labels "$LABELS_JSON" '{labels: $labels}')
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/issues/${{ steps.create_pr.outputs.pr_number }}/labels \
            -d "$PAYLOAD" || true

      - name: request reviewers (only if suspicion)
        if: steps.reviewers.outputs.reviewers != '[]'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEWERS_JSON: ${{ steps.reviewers.outputs.reviewers }}
        run: |
          PAYLOAD=$(jq -nc --argjson reviewers "$REVIEWERS_JSON" '{reviewers: $reviewers}')
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/pulls/${{ steps.create_pr.outputs.pr_number }}/requested_reviewers \
            -d "$PAYLOAD"

      - name: upload artifact (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-finalize-${{ github.run_id }}
          path: |
            /tmp/pr-body.md
            /tmp/values.json
          if-no-files-found: warn
